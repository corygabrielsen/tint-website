# Pre-commit hooks configuration
# See https://pre-commit.com for more information
#
# Install hooks: pre-commit install
# Run manually:  pre-commit run --all-files
# Skip hooks:    git commit --no-verify

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Block commits to branches that don't follow the
      # Conventional Commits pattern documented in CONTRIBUTING.md.
      # `master` and detached HEAD are exempt — `master` matches the
      # regex's escape clause; detached HEAD makes the hook's
      # `git symbolic-ref` call fail and the hook treats that as
      # "not on a branch" and silently passes.
      - id: no-commit-to-branch
        args:
          - "--pattern=^(?!(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[a-z0-9-]+$|master$).*$"
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: validate-commit-message
        name: Validate commit message (subject line)
        entry: scripts/validate-commit-message.sh --no-pr-suffix
        language: script
        stages: [commit-msg]
