name: "CI: PR Title"

# Validates the PR title length against the rule that the
# commit-msg pre-commit hook enforces locally. On squash merge
# GitHub uses the PR title (with " (#N)" appended) as the commit
# subject — so this gate ensures the merged commit on master fits
# the 50-char subject budget regardless of what was in any local
# commit. The body of the PR is unconstrained.
#
# Design choices worth preserving when copying:
#
#   1. Trusted script. Checks out the base branch (or the repo's
#      default branch on workflow_dispatch) so the validator script
#      is always the version on the target branch, not whatever a
#      contributor put in the PR head.
#
#   2. Safe metadata. On pull_request events, title/number come
#      from the event payload via env: vars — no `gh pr view` round-
#      trip, no GH_TOKEN, and no shell-injection risk from
#      `${{ }}`-interpolating user-controlled strings into the run
#      block. The workflow_dispatch path falls back to `gh pr view`
#      because the dispatch payload doesn't carry PR data.
#
#   3. Rich step summary. Renders a unicode progress bar showing
#      title length vs the 50 - len(" (#N)") headroom.
#
# Prerequisite: scripts/validate-commit-message.sh in the repo root.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to validate"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read # used only on workflow_dispatch (gh pr view)

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}

      - name: Validate
        env:
          # GH_TOKEN is set ONLY on the workflow_dispatch path, where
          # `gh pr view` needs it. On pull_request runs the env var is
          # an empty string, preserving the "no GH_TOKEN" property of
          # the fast path (and matching the design comment above).
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && github.token || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          DISPATCH_NUMBER: ${{ inputs.pr_number }}
        run: |
          # ---------- 1. Resolve PR fields ----------
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$DISPATCH_NUMBER"
          else
            PR_NUMBER="$EVENT_NUMBER"
          fi

          # Defense in depth: validate the PR number is a positive
          # integer before passing it to `gh`. GitHub's schema
          # already enforces this for both pull_request.number and
          # the workflow_dispatch number-typed input, but a stray
          # value (a leading dash, "0", "01", etc.) would otherwise
          # be parsed as a gh option flag or accepted as a non-
          # existent PR. Bash regex (not shell glob) — a glob like
          # `[1-9][0-9]*` requires a minimum of 2 chars and rejects
          # single-digit numbers; the regex below correctly accepts
          # any positive integer.
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            # PR_NUMBER hasn't been validated yet — render it through
            # indented code (no fence to inject, no inline-code span
            # to break with embedded backticks).
            {
              echo "## ❌ Invalid PR number"
              echo ""
              echo "Got:"
              echo ""
              printf '%s\n' "$PR_NUMBER" | sed 's/^/    /'
              echo ""
              echo "Expected a positive integer."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Fail fast if `gh pr view` fails — otherwise an empty
            # title would silently pass validation.
            if ! PR_TITLE=$(gh pr view "$PR_NUMBER" --json title -q '.title // ""'); then
              echo "## ❌ Failed to fetch PR #${PR_NUMBER} title via \`gh pr view\`" \
                >>"$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            PR_TITLE="$EVENT_TITLE"
          fi

          # ---------- 2. Run validator (subject only) ----------
          # The validator only checks the subject line, so we pipe
          # just the squash-merge subject — no body needed.
          SUBJECT="${PR_TITLE} (#${PR_NUMBER})"
          if printf '%s\n' "$SUBJECT" | scripts/validate-commit-message.sh -; then
            VALIDATION_OK=true
          else
            VALIDATION_OK=false
          fi

          # ---------- 3. Title metrics ----------
          # The PR title alone (before " (#N)" suffix) is what
          # contributors edit. Show its length vs the headroom that
          # leaves: 50 minus the suffix length.
          SUFFIX=" (#${PR_NUMBER})"
          MAX_TITLE_LEN=$((50 - ${#SUFFIX}))
          TITLE_LEN=${#PR_TITLE}

          # ---------- 4. Render progress bar ----------
          # 25-cell unicode bar. C-style for loop avoids the edge
          # case where `printf '█%.0s' $(seq 1 0)` spuriously prints
          # one cell when the count is zero. Bounds-checked against
          # max <= 0 (which would happen only if the PR-number suffix
          # were ≥ 50 chars long — absurd, but guarded anyway).
          render_bar() {
            local current=$1 max=$2 width=25
            if [ "$max" -le 0 ]; then
              local bar="" i
              for ((i = 0; i < width; i++)); do bar+="█"; done
              printf '%s' "$bar"
              return
            fi
            local filled=$((current * width / max))
            [ "$filled" -lt 0 ] && filled=0
            [ "$filled" -gt "$width" ] && filled=$width
            local empty=$((width - filled))
            local bar="" i
            for ((i = 0; i < filled; i++)); do bar+="█"; done
            for ((i = 0; i < empty; i++)); do bar+="░"; done
            printf '%s' "$bar"
          }
          BAR=$(render_bar "$TITLE_LEN" "$MAX_TITLE_LEN")

          # ---------- 5. Step summary ----------
          if [ "$VALIDATION_OK" = "true" ]; then
            {
              echo "## ✅ PR title valid"
              echo ""
              echo "\`$BAR\` ${TITLE_LEN}/${MAX_TITLE_LEN} chars"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # PR title is user-controlled and could contain ``` that
          # would prematurely close a fence; render it through
          # indented code (4-space prefix) instead.
          {
            echo "## ❌ PR title too long"
            echo ""
            OVER=$((TITLE_LEN - MAX_TITLE_LEN))
            echo "\`$BAR\` ❌ ${TITLE_LEN}/${MAX_TITLE_LEN} chars (${OVER} over)"
            echo ""
            printf '%s\n' "$PR_TITLE" | sed 's/^/    /'
            echo ""
            echo "> **Tips:** drop filler words (*a*, *the*), abbreviate (*config* not *configuration*), use the imperative."
          } >>"$GITHUB_STEP_SUMMARY"
          exit 1
