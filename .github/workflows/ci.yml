name: "CI: Website"

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Validate Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Single source of truth for the validation chain. Defined in
      # package.json as `check`, also invoked by wrangler.jsonc
      # build.command so that both this Action and Cloudflare
      # Workers Builds run the exact same sequence. Reorder or add
      # a step in package.json once; both entrypoints inherit it.
      - run: npm run check
