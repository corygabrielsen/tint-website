name: "CI: Label PRs"

# ---------------------------------------------------------------------------
# Auto-labels PRs by changed file paths (rules in .github/labeler.yml).
# Uses pull_request_target for write access from fork PRs (safe: no checkout).
# Requires: contents: read, pull-requests: write.
# ---------------------------------------------------------------------------

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  apply-labels:
    name: Apply Labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
