documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md"]

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/labeler.yml"
          - ".github/dependabot.yml"

dependencies:
  - changed-files:
      - any-glob-to-any-file: ["package.json", "package-lock.json"]

astro:
  - changed-files:
      - any-glob-to-any-file: ["**/*.astro"]

css:
  - changed-files:
      - any-glob-to-any-file: ["**/*.css"]

javascript:
  - changed-files:
      - any-glob-to-any-file: ["**/*.{js,mjs,cjs}"]

shell:
  - changed-files:
      - any-glob-to-any-file: ["**/*.sh"]
